<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio de Fotografia</title>
    
    <style>
        body {
            margin: 0;
            font-family: Courier, monospace;
            background-color: #99B0B0; 
        }
        
        header {
            text-align: center;
            padding: 60px 20px;
            background-color: #1AB7B7; 
            color: white;
        }

        /* Aumentando o tamanho do título principal */
        header h1 {
            font-size: 3.5em; 
            margin: 0; 
            margin-bottom: 10px; 
        }

        /* Estilo dos títulos de cada sessão */
        .sessao-titulo {
            text-align: center;
            color: white; 
            font-size: 2em;
            margin-top: 60px; 
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        /* Grade onde as fotos vão ficar */
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px; 
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto; 
        }

        .foto {
            width: 100%;
            height: 300px;
            object-fit: cover; 
            border-radius: 4px; 
            transition: transform 0.3s; 
        }

        .foto:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <header>
        <h1>Baraldi Fotografia</h1>
        <p>Portfólio Fotográfico</p>
    </header>

    <!-- Sessão 1: Fotografia de Retrato -->
    <h2 class="sessao-titulo">Retratos</h2>
    <section class="galeria">
        <img class="foto" src="imagens/retrato1.JPG" alt="Aline">
        <img class="foto" src="imagens/retrato2.jpg" alt="Cristina">
        <img class="foto" src="imagens/retrato3.jpg" alt="Bruno">
    </section>

    <!-- Sessão 2: Eventos -->
    <h2 class="sessao-titulo">Eventos</h2>
    <section class="galeria">
        <img class="foto" src="imagens/evento1.jpg" alt="Lucas e Aline">
        <img class="foto" src="imagens/evento2.jpg" alt="Luan">
        <img class="foto" src="imagens/evento3.jpg" alt="Emily">
    </section>

    <!-- Sessão 3: E-commerce -->
    <h2 class="sessao-titulo">E-commerce</h2>
    <section class="galeria">
        <img class="foto" src="imagens/ecommerce1.jpg" alt="Fotografia de produto still">
        <img class="foto" src="imagens/ecommerce2.jpg" alt="Produto com fundo branco">
        <img class="foto" src="imagens/ecommerce3.jpg" alt="Detalhes de textura do produto">
    </section>

    <!-- Sessão 4: Artístico -->
    <h2 class="sessao-titulo">Artístico</h2>
    <section class="galeria">
        <img class="foto" src="imagens/artistico1.jpg" alt="Luan">
        <img class="foto" src="imagens/artistico2.jpg" alt="Ragira">
        <img class="foto" src="imagens/artistico3.jpg" alt="Bruna">
    </section>

</body>
</html>

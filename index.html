<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio de Fotografia</title>
    
    <style>
        body {
            margin: 0;
            font-family: Courier, monospace;
            background-color: #99B0B0; /* Cor de fundo agora invertida (era do cabeçalho) */
        }
        
        header {
            text-align: center;
            padding: 60px 20px;
            background-color: #1AB7B7; /* Fundo do cabeçalho invertido (era do corpo) */
            color: white;
        }

        /* Aumentando o tamanho do título principal */
        header h1 {
            font-size: 3.5em; /* Controla o tamanho do "Baraldi Fotografia" */
            margin: 0; 
            margin-bottom: 10px; /* Dá um pequeno espaço entre o título e o subtítulo */
        }

        /* Estilo dos títulos de cada sessão */
        .sessao-titulo {
            text-align: center;
            color: white; 
            font-size: 2em;
            margin-top: 60px; 
            margin-bottom: 20px;
            letter-spacing: 2px;
            /* O comando que forçava a caixa alta foi removido daqui */
        }

        /* Grade onde as fotos vão ficar */
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px; 
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto; 
        }

        .foto {
            width: 100%;
            height: 300px;
            object-fit: cover; 
            border-radius: 4px; 
            transition: transform 0.3s; 
        }

        .foto:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <header>
        <h1>Baraldi Fotografia</h1>
        <p>Portfólio Fotográfico</p>
    </header>

    <!-- Sessão 1: Fotografia de Retrato -->
    <h2 class="sessao-titulo">Retratos</h2>
    <section class="galeria">
        <img class="foto" src="imagens/retrato1.jpg" alt="Retrato com lente 50mm">
        <img class="foto" src="imagens/retrato2.jpg" alt="Retrato com iluminação cinematográfica">
        <img class="foto" src="imagens/retrato3.jpg" alt="Retrato em estilo Polaroid">
    </section>

    <!-- Sessão 2: Eventos -->
    <h2 class="sessao-titulo">Eventos</h2>
    <section class="galeria">
        <img class="foto" src="imagens/evento1.jpg" alt="Fotografia de evento corporativo">
        <img class="foto" src="imagens/evento2.jpg" alt="Cobertura de evento noturno">
        <img class="foto" src="imagens/evento3.jpg" alt="Detalhes de decoração do evento">
    </section>

    <!-- Sessão 3: E-commerce -->
    <h2 class="sessao-titulo">E-commerce</h2>
    <section class="galeria">
        <img class="foto" src="imagens/ecommerce1.jpg" alt="Fotografia de produto still">
        <img class="foto" src="imagens/ecommerce2.jpg" alt="Produto com fundo branco">
        <img class="foto" src="imagens/ecommerce3.jpg" alt="Detalhes de textura do produto">
    </section>

</body>
</html>

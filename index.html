<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baraldi Fotografia | Portfólio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: 'Lato', sans-serif;
            background-color: #121212; 
            color: #E0E0E0;
        }
        
        header {
            text-align: center;
            padding: 50px 20px 30px;
            background-color: #0A0A0A;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5em; 
            margin: 0; 
            font-weight: 400;
            color: #FFFFFF;
        }

        header p {
            font-weight: 300;
            letter-spacing: 2px;
            color: #A0A0A0;
            margin-top: 10px;
        }

        .contato-header {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .contato-header a {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 0.9em;
            letter-spacing: 1px;
            border-bottom: 1px solid transparent;
            transition: border-bottom 0.3s;
        }

        .contato-header a:hover {
            border-bottom: 1px solid #FFFFFF;
        }

        nav {
            background-color: #1A1A1A;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        nav a {
            color: #CCCCCC;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1.5px;
            padding: 5px 10px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #FFFFFF;
        }

        .sessao-titulo {
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 2.2em;
            font-weight: 400;
            margin-top: 80px; 
            margin-bottom: 30px;
            color: #FFFFFF;
        }

        /* --- NOVO LAYOUT DE GRID ASSIMÉTRICO --- */
        .grupo-fotos {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 colunas de tamanhos iguais */
            grid-auto-rows: 250px; /* Altura padrão para as fotos menores */
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto 50px auto; /* Centraliza e dá espaço entre os grupos */
            padding: 0 20px;
        }

        .foto {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            border-radius: 2px; 
            cursor: pointer; 
            transition: transform 0.4s ease, filter 0.4s ease;
            filter: grayscale(20%); 
        }

        .foto:hover {
            transform: scale(1.02);
            filter: grayscale(0%); 
        }

        /* Foto maior do canto superior esquerdo */
        .foto-destaque {
            grid-column: span 2; /* Ocupa 2 colunas de largura */
            grid-row: span 2;    /* Ocupa 2 linhas de altura */
        }

        /* Responsividade para Tablets */
        @media (max-width: 768px) {
            .grupo-fotos {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Responsividade para Celulares */
        @media (max-width: 480px) {
            .grupo-fotos {
                grid-template-columns: 1fr;
                grid-auto-rows: 250px;
            }
            .foto-destaque {
                grid-column: span 1;
                grid-row: span 1;
                height: 350px;
            }
        }

        /* --- ESTILOS DO POP-UP (LIGHTBOX) --- */
        .lightbox {
            display: none; 
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95); 
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .lightbox-img {
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .fechar {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #FFFFFF;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }

        .fechar:hover {
            color: #A0A0A0;
        }
    </style>
</head>
